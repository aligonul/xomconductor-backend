[project]
name = "xomconductor"
version = "0.1.0"
description = "Salesforce Case Manager Email Drafting Automation with Slack and Claude"
requires-python = ">=3.10"
dependencies = [
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.21.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.39.0",
    "simple-salesforce>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
xomconductor = "src.xomconductor.app:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
